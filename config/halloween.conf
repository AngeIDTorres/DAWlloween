ServerName halloween.dev

<VirtualHost *:80>
    ServerName halloween.dev
    ServerAlias www.halloween.dev halloween.local www.halloween.local halloween.test www.halloween.test
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        DirectoryIndex index.php
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteRule ^/?index\.html$ /index.php [R=301,L]
        RewriteRule ^/?pages/(.+)\.html$ /pages/$1.php [R=301,L]
    </Directory>

    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/halloween_error.log
    CustomLog ${APACHE_LOG_DIR}/halloween_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName halloween.dev
    ServerAlias www.halloween.dev halloween.local www.halloween.local halloween.test www.halloween.test
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/halloween.crt
    SSLCertificateKeyFile /etc/apache2/ssl/halloween.key

    <Directory /var/www/html>
        DirectoryIndex index.php
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteRule ^/?index\.html$ /index.php [R=301,L]
        RewriteRule ^/?pages/(.+)\.html$ /pages/$1.php [R=301,L]
    </Directory>

    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/halloween_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/halloween_ssl_access.log combined
</VirtualHost>
