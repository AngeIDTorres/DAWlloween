ServerName halloween.dev

<VirtualHost *:80>
    ServerName halloween.dev
    ServerAlias www.halloween.dev halloween.local www.halloween.local halloween.test www.halloween.test
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/halloween_error.log
    CustomLog ${APACHE_LOG_DIR}/halloween_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName halloween.dev
    ServerAlias www.halloween.dev halloween.local www.halloween.local halloween.test www.halloween.test
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/halloween.crt
    SSLCertificateKeyFile /etc/apache2/ssl/halloween.key

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/halloween_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/halloween_ssl_access.log combined
</VirtualHost>
