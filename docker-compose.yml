---
services:
  web:
    image: php:8.2-apache
    container_name: halloween_apache
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./app:/var/www/html
      - ./config/halloween.conf:/etc/apache2/sites-available/000-default.conf
      - ./config/php.ini:/usr/local/etc/php/conf.d/custom-php.ini
      - ./config/sendmail.ini:/etc/sendmail.ini
      - ./config/sendmail.php:/usr/sbin/sendmail
    environment:
      - TZ=Europe/Madrid
    restart: unless-stopped
    command: bash -c "a2enmod ssl rewrite && chmod +x /usr/sbin/sendmail && mkdir -p /etc/apache2/ssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/apache2/ssl/halloween.key -out /etc/apache2/ssl/halloween.crt -subj '/CN=halloween.dev/O=DAWlloween' && apache2-foreground"
